<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 600 250" width="600" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    /* One palette for light and dark pages alike: transparent background, mid tones only. */
    .part { fill: #9aa4af; stroke: #5c6670; stroke-width: 1.5; }
    .ground { fill: #a57c4c; }
    .ray { stroke: #e5534b; stroke-width: 2.5; stroke-dasharray: 7 4; fill: none; }
    .hit { fill: #e5534b; }
    .dim { stroke: #848d97; stroke-width: 1.3; fill: none; }
    .sep { stroke: #848d97; stroke-width: 1; opacity: 0.4; }
    .title { fill: #848d97; font-weight: 700; font-size: 14px; }
    .text { fill: #848d97; }
    .note { fill: #848d97; font-size: 12px; }
    .rayLabel { fill: #e5534b; font-size: 12px; font-weight: 600; }
    .arrowHead { fill: #848d97; }
    .onPart { fill: #2f363d; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowHead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <!-- A landing leg drawn along +y: the part it is attached to above the origin, the strut and the foot below.
         The suspension's ray starts at the origin and runs along +y. -->
    <g id="leg">
      <rect class="part" x="-22" y="-30" width="44" height="30" rx="4"/>
      <rect class="part" x="-4" y="0" width="8" height="60"/>
      <rect class="part" x="-16" y="60" width="32" height="8" rx="2"/>
    </g>
  </defs>

  <line class="sep" x1="300" y1="65" x2="300" y2="290"/>

  <!-- Standing: the ray follows the leg down to the ground. -->
  <g>
    <rect class="ground" x="20" y="220" width="260" height="12"/>
    <use href="#leg" transform="translate(150,152)"/>
    <line class="ray" x1="150" y1="152" x2="150" y2="220"/>
    <circle class="hit" cx="150" cy="220" r="4.5"/>
    <text class="rayLabel" x="122" y="200" text-anchor="end">ray</text>
    <line class="dim" x1="190" y1="153" x2="190" y2="219" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="note" x="198" y="183">distance</text>
    <text class="note" x="198" y="198">read</text>
    <text class="title" x="150" y="260" text-anchor="middle">Standing</text>
    <text class="text" x="150" y="278" text-anchor="middle">The ray follows the leg's axis</text>
    <text class="text" x="150" y="294" text-anchor="middle">down to the ground.</text>
  </g>

  <!-- Against another vessel: the ray hits its side, and the suspension pushes against it. -->
  <g transform="translate(300,0)">
    <rect class="ground" x="20" y="220" width="260" height="12"/>
    <rect class="part" x="170" y="70" width="110" height="150" rx="8"/>
    <text class="onPart" x="225" y="140" text-anchor="middle">other</text>
    <text class="onPart" x="225" y="155" text-anchor="middle">vessel</text>
    <use href="#leg" transform="translate(50,198) rotate(-90)"/>
    <line class="ray" x1="50" y1="198" x2="170" y2="198"/>
    <circle class="hit" cx="170" cy="198" r="4.5"/>
    <line class="dim" x1="124" y1="170" x2="164" y2="170" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="note" x="144" y="162" text-anchor="middle">push</text>
    <text class="title" x="150" y="260" text-anchor="middle">Against another vessel</text>
    <text class="text" x="150" y="278" text-anchor="middle">The ray hits its side:</text>
    <text class="text" x="150" y="294" text-anchor="middle">the leg pushes against it.</text>
  </g>
</svg>
