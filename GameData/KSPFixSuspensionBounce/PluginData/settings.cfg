// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a leg's damper
// starts or stops being limited.
logLevel = Info

// Whether a bottomed suspension tells the tyres the weight its end-stop carries (true), or only its spring's, as in
// stock (false).
bumpStopLoad = true
