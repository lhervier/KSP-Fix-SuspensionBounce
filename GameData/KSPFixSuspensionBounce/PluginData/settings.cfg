// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a leg's damper
// starts or stops being limited.
logLevel = Info

// Whether a bottomed suspension tells the tyres the weight its end-stop carries (true), or only its spring's, as in
// stock (false).
bumpStopLoad = true

// Below 1 g, hold the gravity curve of the spring's boost at its value on Kerbin, so that a heavy rover no longer
// sinks to the end of its travel on the Mun: true or false.
kerbinCurve = true

// Whether to lower a damper too strong for the mass its suspension carries, while its wheel touches the ground (true),
// or leave the damper KSP sets (false).
damperLimit = true

// Whether to size the damper of a suspension whose wheel is in the air for the mass it will carry at the next contact
// (true), or let it keep the damper of its last contact, as in stock (false).
airDamper = true

// Whether the tyres read how fast their contact slides from how the physics really moved the wheel over the last step,
// so that a parked vessel no longer creeps (true), or from the wheel's Rigidbody velocity, as in stock (false).
tyreReadsPoses = true

// Whether a slow tyre holds a force that lasts without creeping, so that a rover no longer turns on itself as it comes
// to rest with its brakes off (true), or holds it only while it slides, as in stock (false). Off by default: on a wheel
// or leg whose tyre force VPP smooths slowly, as some from other mods may, it can make a light vessel swing on itself
// without end. On, it gives the stock LT-05 leg the smoothing of every other stock wheel. Only with
// tyreReadsPoses = true.
staticGrip = false

// Measure what the mod costs per physics step, and what the game's wheels cost beside it: one line in KSP.log every
// 10 s of flight (true). Off (false), the measure is not installed at all and costs nothing.
measureCost = false
