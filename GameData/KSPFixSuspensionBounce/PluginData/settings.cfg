// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How the damper of each landing leg, wheel and landing gear touching the ground is sized:
// - Minimal: the damper KSP sets is kept, unless it is too stiff for the mass the leg carries, which then bounces
//   off the ground faster at each physics step until it is thrown into the air. Only very light vessels and parts
//   placed alone in EVA construction reach that limit: every other vessel behaves as without the mod.
// - MassBased: every damper is sized from the leg's spring and the mass the leg carries, so that light and heavy
//   vessels settle on their legs alike. KSP sizes it from the spring alone: heavy vessels keep bouncing on their
//   legs, light ones are held too stiffly. This changes how every lander and rover settles.
// - Stock: the mod changes nothing.
mode = Minimal

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a leg's damper
// starts or stops being limited, and in MassBased mode, one line the first time each leg is sized.
logLevel = Info
