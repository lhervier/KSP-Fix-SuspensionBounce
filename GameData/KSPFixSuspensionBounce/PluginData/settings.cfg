// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a leg's damper
// starts or stops being limited.
logLevel = Info

// Whether a bottomed suspension tells the tyres the weight its end-stop carries (true), or only its spring's, as in
// stock (false).
bumpStopLoad = true

// Below 1 g, hold the gravity curve of the spring's boost at its value on Kerbin, so that a heavy rover no longer
// sinks to the end of its travel on the Mun: true or false.
kerbinCurve = true

// Whether to lower a damper too strong for the mass its suspension carries, and size the damper of a suspension in
// the air (true), or leave the dampers KSP sets (false).
damperLimit = true

// Whether the tyres read how fast their contact slides from how the physics really moved the wheel over the last step,
// so that a parked vessel no longer creeps (true), or from the wheel's Rigidbody velocity, as in stock (false).
tyreReadsPoses = true

// Measure what the mod costs per physics step, and what the game's wheels cost beside it: one line in KSP.log every
// 10 s of flight (true). Off (false), the measure is not installed at all and costs nothing.
measureCost = false
